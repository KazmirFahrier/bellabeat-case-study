name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Parse R sources
        run: Rscript -e 'invisible(lapply(list.files("R", pattern = "[.]R$", full.names = TRUE), parse))'
      - name: Run pipeline and scientific checks
        run: Rscript tests/test_pipeline.R
